<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">

  <!-- Base badge / scope lens rings -->
  <circle cx="200" cy="200" r="190" fill="#15171a" stroke="#3450d6" stroke-width="6"/>
  <circle cx="200" cy="200" r="178" fill="none" stroke="#3450d6" stroke-width="1.5" opacity="0.6"/>
  <circle cx="200" cy="200" r="165" fill="none" stroke="#3450d6" stroke-width="1.5" opacity="0.5"/>

  <!-- Rivets -->
  <g fill="#3450d6">
    <circle cx="200" cy="16"  r="4"/>
    <circle cx="200" cy="384" r="4"/>
    <circle cx="16"  cy="200" r="4"/>
    <circle cx="384" cy="200" r="4"/>
    <circle cx="66"  cy="66"  r="3.5"/>
    <circle cx="334" cy="66"  r="3.5"/>
    <circle cx="66"  cy="334" r="3.5"/>
    <circle cx="334" cy="334" r="3.5"/>
  </g>

  <!-- Sniper-scope duplex crosshair, open center where the rifle sits -->
  <g stroke="#3450d6" stroke-linecap="square">
    <line x1="200" y1="90"  x2="200" y2="133" stroke-width="7"/>
    <line x1="200" y1="133" x2="200" y2="168" stroke-width="3"/>
    <line x1="200" y1="310" x2="200" y2="267" stroke-width="7"/>
    <line x1="200" y1="267" x2="200" y2="232" stroke-width="3"/>
    <line x1="90"  y1="205" x2="133" y2="205" stroke-width="7"/>
    <line x1="133" y1="205" x2="168" y2="205" stroke-width="3"/>
    <line x1="310" y1="205" x2="267" y2="205" stroke-width="7"/>
    <line x1="267" y1="205" x2="232" y2="205" stroke-width="3"/>
    <g stroke-width="3">
      <line x1="193" y1="105" x2="207" y2="105"/>
      <line x1="193" y1="120" x2="207" y2="120"/>
      <line x1="193" y1="295" x2="207" y2="295"/>
      <line x1="193" y1="280" x2="207" y2="280"/>
      <line x1="105" y1="198" x2="105" y2="212"/>
      <line x1="120" y1="198" x2="120" y2="212"/>
      <line x1="295" y1="198" x2="295" y2="212"/>
      <line x1="280" y1="198" x2="280" y2="212"/>
    </g>
  </g>

  <!-- Arc paths for curved text -->
  <path id="topArc" d="M 50,200 A 150,150 0 0 1 350,200" fill="none"/>
  <path id="bottomArc" d="M 50,200 A 150,150 0 0 0 350,200" fill="none"/>

  <text font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="46"
        letter-spacing="8" fill="#ffffff" stroke="#3450d6" stroke-width="1.5">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">GPS</textPath>
  </text>

  <text font-family="Arial, sans-serif" font-weight="700" font-size="15"
        letter-spacing="2.5" fill="#5b7cf0">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">GUN • PART • SELECTOR</textPath>
  </text>

  <circle cx="50" cy="200" r="4.5" fill="#3450d6"/>
  <circle cx="350" cy="200" r="4.5" fill="#3450d6"/>

  <!-- AR15 silhouette: blocky, right-angle only, no tapers or points -->
  <g transform="translate(200,205) scale(0.35) translate(-315,-103)" fill="#ffffff">
    <!-- stock, made taller/more prominent than the buffer tube -->
    <rect x="10" y="45" width="75" height="48"/>
    <!-- buttpad separator -->
    <rect x="16" y="45" width="4" height="48" fill="#15171a"/>
    <!-- adjustment notches -->
    <g fill="#15171a">
      <rect x="35" y="50" width="4" height="10"/>
      <rect x="50" y="50" width="4" height="10"/>
      <rect x="65" y="50" width="4" height="10"/>
    </g>
    <!-- buffer tube -->
    <rect x="85" y="64" width="65" height="12"/>
    <!-- main body: lower receiver + upper receiver + handguard as one continuous block -->
    <rect x="150" y="50" width="400" height="34"/>
    <!-- top rail -->
    <rect x="235" y="38" width="315" height="12"/>
    <!-- charging handle -->
    <rect x="245" y="28" width="18" height="10"/>
    <!-- barrel -->
    <rect x="550" y="58" width="40" height="8"/>
    <!-- muzzle device -->
    <rect x="590" y="50" width="30" height="20"/>
    <!-- pistol grip -->
    <rect x="170" y="84" width="26" height="55"/>
    <!-- trigger guard -->
    <rect x="200" y="84" width="28" height="18" fill="none" stroke="#ffffff" stroke-width="6"/>
    <!-- magazine -->
    <rect x="255" y="84" width="55" height="75"/>
    <rect x="262" y="159" width="40" height="18"/>
    <!-- handguard slots -->
    <g fill="#15171a">
      <rect x="345" y="58" width="20" height="8"/>
      <rect x="385" y="58" width="20" height="8"/>
      <rect x="425" y="58" width="20" height="8"/>
      <rect x="465" y="58" width="20" height="8"/>
      <rect x="505" y="58" width="20" height="8"/>
    </g>
    <!-- magazine rib lines -->
    <g fill="#15171a">
      <rect x="270" y="90" width="4" height="60"/>
      <rect x="285" y="90" width="4" height="60"/>
    </g>
  </g>

</svg>
