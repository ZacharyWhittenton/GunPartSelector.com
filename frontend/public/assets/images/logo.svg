<svg viewBox="0 0 1264 855" xmlns="http://www.w3.org/2000/svg">

  <!-- Flag mark -->
  <g>
    <polygon points="210,150 460,150 420,282 170,282" fill="#132a4c"/>
    <polygon points="335,167 343.6,193.2 371.1,193.3 348.9,209.5 357.3,235.7 335,219.6 312.7,235.7 321.1,209.5 298.9,193.3 326.4,193.2" fill="#ffffff"/>

    <polygon points="472,152 900,152 860,190 432,190" fill="#a11d2b"/>
    <polygon points="452,198 860,198 820,236 412,236" fill="#a11d2b"/>
    <polygon points="432,244 830,244 790,282 392,282" fill="#a11d2b"/>
  </g>

  <!-- GPS wordmark -->
  <text
    x="632" y="610"
    font-family="Arial Black, Arial, sans-serif"
    font-weight="900"
    font-size="330"
    text-anchor="middle"
  >
    <tspan fill="#132a4c">G</tspan><tspan fill="#1b1b1b">P</tspan><tspan fill="#a11d2b">S</tspan>
  </text>

  <!-- AR-15 silhouette running through the wordmark -->
  <g transform="translate(600,505) scale(1.3) translate(-315,-103)" fill="#f7f8fa">
    <!-- adjustable buttstock -->
    <rect x="10" y="45" width="75" height="48"/>
    <g fill="#132a4c">
      <rect x="35" y="50" width="4" height="10"/>
      <rect x="50" y="50" width="4" height="10"/>
      <rect x="65" y="50" width="4" height="10"/>
    </g>

    <!-- buffer tube -->
    <rect x="85" y="64" width="65" height="12"/>

    <!-- upper receiver + handguard, continuous band -->
    <rect x="150" y="50" width="400" height="34"/>
    <rect x="235" y="38" width="315" height="12"/>
    <rect x="245" y="28" width="18" height="10"/>

    <!-- barrel -->
    <rect x="550" y="58" width="40" height="8"/>

    <!-- muzzle device with twin ports -->
    <rect x="590" y="50" width="34" height="20"/>
    <circle cx="601" cy="60" r="3" fill="#1b1b1b"/>
    <circle cx="613" cy="60" r="3" fill="#1b1b1b"/>

    <!-- pistol grip + trigger guard -->
    <rect x="170" y="84" width="26" height="55"/>
    <rect x="200" y="84" width="28" height="18" fill="none" stroke="#f7f8fa" stroke-width="6"/>

    <!-- magazine -->
    <rect x="255" y="84" width="55" height="75"/>
    <rect x="262" y="159" width="40" height="18"/>

    <!-- handguard rail ribs -->
    <g fill="#a11d2b">
      <rect x="345" y="58" width="20" height="8"/>
      <rect x="385" y="58" width="20" height="8"/>
      <rect x="425" y="58" width="20" height="8"/>
      <rect x="465" y="58" width="20" height="8"/>
      <rect x="505" y="58" width="20" height="8"/>
    </g>

    <!-- magazine rib lines -->
    <g fill="#c9cdd3">
      <rect x="270" y="90" width="4" height="60"/>
      <rect x="285" y="90" width="4" height="60"/>
    </g>
  </g>

  <!-- GUN PART SELECTOR -->
  <text
    x="632" y="700"
    font-family="Arial, sans-serif"
    font-weight="800"
    font-size="66"
    letter-spacing="16"
    text-anchor="middle"
    fill="#1b1b1b"
  >
    GUN PART SELECTOR
  </text>

  <!-- Tagline -->
  <g font-family="Arial, sans-serif" font-weight="700" font-size="30" letter-spacing="4">
    <line x1="150" y1="775" x2="330" y2="775" stroke="#132a4c" stroke-width="3"/>
    <text x="632" y="786" text-anchor="middle">
      <tspan fill="#132a4c">BUILD IT. </tspan><tspan fill="#a11d2b">YOUR WAY.</tspan>
    </text>
    <line x1="934" y1="775" x2="1114" y2="775" stroke="#a11d2b" stroke-width="3"/>
  </g>

</svg>
