<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>WD Web Solutions | Website Design & Development</title>
  <meta name="description" content="Professional website design, web application development, e-commerce, and ongoing support for growing businesses in Austin, TX.">

  <!-- Social share preview (Open Graph / Twitter). Angular's SeoService overrides
       these per-page at runtime, but crawlers that don't execute JS read these
       static defaults. Once this site has a production domain, replace the
       relative og:image/twitter:image paths below with absolute URLs. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="WD Web Solutions">
  <meta property="og:title" content="WD Web Solutions | Website Design & Development">
  <meta property="og:description" content="Professional website design, web application development, e-commerce, and ongoing support for growing businesses in Austin, TX.">
  <meta property="og:image" content="/assets/images/hero-poster.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="WD Web Solutions | Website Design & Development">
  <meta name="twitter:description" content="Professional website design, web application development, e-commerce, and ongoing support for growing businesses in Austin, TX.">
  <meta name="twitter:image" content="/assets/images/hero-poster.jpg">

  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Structured data. Only fields we actually have real content for are
       included; fill in telephone/streetAddress/sameAs (social profiles)
       once they exist rather than leaving placeholder values. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ProfessionalService",
    "name": "WD Web Solutions",
    "description": "Professional website design, web application development, e-commerce, and ongoing support for growing businesses.",
    "email": "zachw@wdwebsolutions.com",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Austin",
      "addressRegion": "TX",
      "addressCountry": "US"
    }
  }
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
