<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>GunPartSelector.com | Build Your AR-15, Part by Part</title>
  <meta name="description" content="Browse AR-15 parts by category, build your rifle with live compatibility checks, and share your build. Barrels, uppers, lowers, optics, and more.">

  <!-- Social share preview (Open Graph / Twitter). Angular's SeoService overrides
       these per-page at runtime, but crawlers that don't execute JS read these
       static defaults. Once this site has a production domain, replace the
       relative og:image/twitter:image paths below with absolute URLs. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="GunPartSelector.com">
  <meta property="og:title" content="GunPartSelector.com | Build Your AR-15, Part by Part">
  <meta property="og:description" content="Browse AR-15 parts by category, build your rifle with live compatibility checks, and share your build. Barrels, uppers, lowers, optics, and more.">
  <meta property="og:image" content="/assets/images/logo.svg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="GunPartSelector.com | Build Your AR-15, Part by Part">
  <meta name="twitter:description" content="Browse AR-15 parts by category, build your rifle with live compatibility checks, and share your build. Barrels, uppers, lowers, optics, and more.">
  <meta name="twitter:image" content="/assets/images/logo.svg">

  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="/assets/images/logo.svg">
  <link rel="alternate icon" type="image/x-icon" href="favicon.ico">

  <!-- Structured data. Only fields we actually have real content for are
       included; fill in telephone/streetAddress/sameAs (social profiles)
       once they exist rather than leaving placeholder values. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "GunPartSelector.com",
    "description": "An online AR-15 build configurator: browse parts by category, check compatibility, and build your rifle."
  }
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
