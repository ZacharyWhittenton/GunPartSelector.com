<div class="forge-theme min-h-screen bg-forge-ink pb-20">

  <app-page-hero
    imageUrl="/assets/images/scenery/alpine-forest-lake.jpg"
    imageAlt=""
    eyebrow="Guides"
    title="Buying & Compatibility Guides"
    subtitle="The background behind the compatibility checks the builder makes for you."
  ></app-page-hero>

  <app-page-container>

    <div class="mt-16 grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3" appScrollReveal>
      @for (resource of resources; track resource.slug) {
        <div class="rounded-lg border border-forge-line bg-forge-steel p-6">
          <i class="fa-solid fa-{{ resource.icon }} text-lg text-forge-accent" aria-hidden="true"></i>
          <p class="mt-3 font-mono text-[11px] uppercase tracking-wide text-forge-text-muted">{{ resource.category }}</p>
          <h2 class="mt-1 font-semibold text-forge-text">{{ resource.title }}</h2>
          <p class="mt-2 text-sm leading-relaxed text-forge-text-muted">{{ resource.description }}</p>
        </div>
      }
    </div>

  </app-page-container>
</div>
