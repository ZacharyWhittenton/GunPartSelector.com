<section class="py-16">
  <div class="mx-auto max-w-5xl px-6">

    <a routerLink="/marketplace" class="text-sm font-semibold text-blue-600 hover:text-blue-800">
      ← Back to Marketplace
    </a>

    @if(errorMessage())
    {
    <p class="mt-6 rounded-lg bg-red-50 px-4 py-3 text-sm text-red-600">{{ errorMessage() }}</p>
    }

    @if(isLoading())
    {
    <p class="mt-6 text-gray-500">Loading…</p>
    }
    @else if(item(); as currentItem)
    {
    <div class="mt-8 grid gap-10 md:grid-cols-2">
      @if(currentItem.imageUrl)
      {
      <img
        [src]="currentItem.imageUrl"
        [alt]="currentItem.name"
        class="w-full rounded-xl object-cover shadow-lg"
      >
      }
      @else
      {
      <div class="flex h-72 w-full items-center justify-center rounded-xl bg-gray-100 text-gray-400">
        No image
      </div>
      }

      <div>
        <h1 class="text-3xl font-bold text-gray-900">{{ currentItem.name }}</h1>
        <p class="mt-4 text-2xl font-bold text-blue-600">
          {{ (currentItem.priceCents / 100) | currency }}
        </p>
        <p class="mt-6 whitespace-pre-line text-gray-600">{{ currentItem.description }}</p>

        <div class="mt-8 flex items-center gap-3">
          <label for="quantity" class="text-sm font-semibold text-gray-700">Qty</label>
          <input
            id="quantity"
            type="number"
            min="1"
            max="20"
            [(ngModel)]="quantity"
            class="
            w-20
            rounded-lg
            border
            border-gray-300
            px-3
            py-2
            text-sm
            focus:outline-none
            focus:ring-2
            focus:ring-blue-600"
          >
        </div>

        <div class="mt-6 flex flex-wrap gap-3">
          <button
            type="button"
            (click)="addToCart()"
            class="
            rounded-lg
            bg-blue-600
            px-6
            py-3
            font-semibold
            text-white
            transition
            hover:-translate-y-1
            hover:bg-blue-700
            hover:shadow-lg"
          >
            {{ wasAdded() ? 'Added to Cart!' : 'Add to Cart' }}
          </button>

          <button
            type="button"
            (click)="toggleWishlist()"
            class="
            rounded-lg
            border
            border-gray-300
            px-6
            py-3
            font-semibold
            text-gray-700
            transition
            hover:bg-gray-50"
          >
            {{ isWishlisted() ? '♥ Wishlisted' : '♡ Add to Wishlist' }}
          </button>
        </div>
      </div>
    </div>
    }

  </div>
</section>
