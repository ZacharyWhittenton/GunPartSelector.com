<section class="forge-theme flex min-h-screen items-center justify-center bg-forge-ink px-6">

    <div class="w-full max-w-md rounded-xl border border-forge-line bg-forge-steel p-8 shadow-sm">

      <h1 class="text-center text-3xl font-bold text-forge-text">
        Login
      </h1>

      <p class="mt-2 text-center text-forge-text-muted">
        Access your GunPartSelector.com account.
      </p>

      @if(errorMessage())
      {
      <p class="mt-4 rounded-lg bg-forge-danger-muted px-4 py-3 text-sm text-forge-danger">
        {{ errorMessage() }}
      </p>
      }

      <form [formGroup]="loginForm" (ngSubmit)="submitLoginForm()" class="mt-8 space-y-5">

        <div>
          <input
            type="email"
            formControlName="emailAddress"
            placeholder="Email"
            class="
            w-full
            rounded-lg
            border
            border-forge-line
            bg-forge-ink
            px-4
            py-3
            text-forge-text
            focus:outline-none
            focus:ring-2
            focus:ring-forge-brass">
          @if(hasError('emailAddress'))
          {
          <p class="mt-1 text-sm text-forge-danger">A valid email address is required.</p>
          }
        </div>

        <div>
          <input
            type="password"
            formControlName="password"
            placeholder="Password"
            class="
            w-full
            rounded-lg
            border
            border-forge-line
            bg-forge-ink
            px-4
            py-3
            text-forge-text
            focus:outline-none
            focus:ring-2
            focus:ring-forge-brass">
          @if(hasError('password'))
          {
          <p class="mt-1 text-sm text-forge-danger">Password is required.</p>
          }
        </div>

        <button
          type="submit"
          [disabled]="isSubmitting()"
          class="
          w-full
          rounded-lg
          bg-forge-accent
          py-3
          font-semibold
          text-white
          transition
          hover:brightness-110
          disabled:cursor-not-allowed
          disabled:opacity-60">
          {{ isSubmitting() ? 'Logging in…' : 'Login' }}
        </button>

        <p class="text-center text-sm text-forge-text-muted">
          Don't have an account?
          <a routerLink="/register" class="font-semibold text-forge-accent hover:underline">Register</a>
        </p>

      </form>

    </div>

  </section>
