<div class="fixed bottom-6 right-6 z-50 flex flex-col items-end">

  @if(isOpen())
  {
  <div
    class="
      forge-theme
      mb-4
      flex
      w-96
      max-w-[calc(100vw-3rem)]
      flex-col
      overflow-hidden
      rounded-xl
      border
      border-forge-line
      bg-forge-ink
      shadow-2xl
    "
  >

    <div class="flex items-center justify-between bg-forge-brass px-4 py-3 text-white">
      <p class="font-semibold">Quick Help</p>
      <button
        type="button"
        (click)="toggle()"
        aria-label="Close quick help"
        class="text-white/80 transition hover:text-white"
      >
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>
    </div>

    <div class="flex flex-col gap-1 px-4 py-4">
      <p class="font-mono text-[11px] uppercase tracking-wide text-forge-text-muted">Common Questions</p>

      @for (entry of quickFaqEntries; track entry.question) {
        <a
          routerLink="/faq"
          (click)="toggle()"
          class="rounded-md px-2 py-2 text-sm text-forge-text transition hover:bg-forge-steel"
        >
          {{ entry.question }}
        </a>
      }

      <a
        routerLink="/faq"
        (click)="toggle()"
        class="mt-2 rounded-md px-2 py-2 text-sm font-semibold text-forge-accent transition hover:bg-forge-steel"
      >
        View all FAQs →
      </a>
    </div>

    <div class="border-t border-forge-line px-4 py-4">
      <p class="text-sm text-forge-text-muted">Still need help?</p>
      <a
        routerLink="/services"
        (click)="toggle()"
        class="mt-2 block rounded-lg bg-forge-accent px-3 py-2 text-center text-sm font-semibold uppercase tracking-wide text-white transition hover:brightness-110"
      >
        Visit Support
      </a>
    </div>

  </div>
  }

  <button
    type="button"
    (click)="toggle()"
    [attr.aria-label]="isOpen() ? 'Close quick help' : 'Open quick help'"
    class="
      flex
      h-14
      w-14
      items-center
      justify-center
      rounded-full
      bg-forge-brass
      text-xl
      text-white
      shadow-lg
      transition
      hover:-translate-y-1
      hover:brightness-110
      hover:shadow-xl
    "
  >
    <i class="fa-solid" [class.fa-circle-question]="!isOpen()" [class.fa-xmark]="isOpen()"></i>
  </button>

</div>
