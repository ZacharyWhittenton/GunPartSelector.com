<section
  class="relative overflow-hidden"
  [class]="height === 'tall' ? 'relative overflow-hidden h-[70vh] min-h-[520px]' : 'relative overflow-hidden h-[42vh] min-h-[320px]'"
>
  <img
    [src]="imageUrl"
    [alt]="imageAlt"
    fetchpriority="high"
    decoding="async"
    class="hero-image absolute inset-0 h-full w-full object-cover"
  >
  <div class="absolute inset-0 bg-gradient-to-t from-[#2b2116]/85 via-[#2b2116]/25 to-[#2b2116]/10"></div>

  @if (eyebrow || title || subtitle) {
    <div class="relative z-10 flex h-full max-w-7xl flex-col justify-end px-6 pb-14 mx-auto">
      <div class="hero-copy max-w-2xl">
        @if (eyebrow) {
          <p class="font-mono text-xs uppercase tracking-[0.2em] text-white/80">{{ eyebrow }}</p>
        }
        @if (title) {
          <h1 class="mt-3 font-[family-name:var(--font-display)] text-4xl font-semibold text-white sm:text-5xl md:text-6xl">
            {{ title }}
          </h1>
        }
        @if (subtitle) {
          <p class="mt-4 max-w-xl text-lg text-white/85">{{ subtitle }}</p>
        }
      </div>
    </div>
  }
</section>
