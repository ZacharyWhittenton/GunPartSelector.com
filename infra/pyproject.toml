[project]
name = "site-infra"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "pulumi>=3,<4",
  "pulumi-aws>=7,<8",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
