[project]
name = "site-api"
version = "0.1.0"
description = "Serverless API for Your Company Name"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "anthropic>=0.75,<1",
  "bcrypt>=4.2,<5",
  "boto3>=1.34,<2",
  "email-validator>=2.2,<3",
  "fastapi>=0.116,<1",
  "loguru>=0.7,<1",
  "mangum>=0.19,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "pyjwt>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "stripe[async]>=15,<16",
]

[dependency-groups]
dev = [
  "alembic>=1.16,<2",
  "httpx>=0.28,<1",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
  "uvicorn[standard]>=0.35,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/site_api"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=site_api --cov-report=term-missing --cov-fail-under=90"
asyncio_mode = "auto"
testpaths = ["tests"]
python_classes = []

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.format]
quote-style = "double"
